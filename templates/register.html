{% extends "base.html" %}
{% block title %}Register - HomeMade Pickles & Snacks{% endblock %}
{% block extra_css %}
<style>
.auth-container { max-width:500px; margin:2rem auto; }
.auth-card { background:#fff; border-radius:16px; padding:2.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.auth-title { font-family:'Playfair Display',serif; font-size:1.8rem; color:var(--primary); margin-bottom:0.3rem; }
.form-group { margin-bottom:1.2rem; }
.form-group label { display:block; font-weight:700; font-size:0.85rem; margin-bottom:0.4rem; }
.form-group input, .form-group textarea {
    width:100%; padding:0.7rem 1rem; border:2px solid var(--border);
    border-radius:8px; font-size:0.95rem; outline:none; transition:border 0.2s; font-family:inherit;
}
.form-group input:focus, .form-group textarea:focus { border-color:var(--primary); }
.hint { font-size:0.78rem; color:var(--muted); margin-top:0.3rem; }
.auth-footer { text-align:center; margin-top:1rem; font-size:0.9rem; color:var(--muted); }
.auth-footer a { color:var(--primary); font-weight:700; }
</style>
{% endblock %}
{% block content %}
<div class="auth-container">
<div class="auth-card">
    <div class="auth-title">🌿 Create Account</div>
    <p style="color:var(--muted);margin-bottom:1.5rem;">Join the HomeMade family</p>
    <form method="POST">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" name="phone" placeholder="+91 9999999999" required>
        </div>
        <div class="form-group">
            <label>Delivery Address *</label>
            <textarea name="address" rows="2" placeholder="Full delivery address..." required></textarea>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <!-- Fix #3: minlength=6 enforced in HTML + backend -->
            <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
            <div class="hint">⚠️ Minimum 6 characters required</div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;">Create Account</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login here</a></div>
</div>
</div>
{% endblock %}
