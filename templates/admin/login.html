<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Pickles & Snacks</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Lato',sans-serif; background:linear-gradient(135deg,#1e2a3a,#8B2500); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-box { background:#fff; border-radius:20px; padding:3rem; width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        .login-icon { text-align:center; font-size:3.5rem; margin-bottom:0.5rem; }
        .login-title { text-align:center; font-family:'Playfair Display',serif; font-size:1.6rem; color:#8B2500; margin-bottom:0.3rem; }
        .login-sub { text-align:center; color:#888; font-size:0.85rem; margin-bottom:2rem; }
        .form-group { margin-bottom:1.2rem; }
        .form-group label { display:block; font-weight:700; font-size:0.82rem; margin-bottom:0.4rem; }
        .form-group input { width:100%; padding:0.75rem 1rem; border:2px solid #e0e0e0; border-radius:8px; font-size:0.95rem; outline:none; transition:border 0.2s; }
        .form-group input:focus { border-color:#8B2500; }
        .btn-login { width:100%; padding:0.85rem; background:#8B2500; color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; transition:background 0.2s; }
        .btn-login:hover { background:#6e1d00; }
        .flash { padding:0.7rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.88rem; background:#f8d7da; color:#721c24; border-left:4px solid #dc3545; }
        .hint-box { background:#fffbea; border:1px solid #ffc107; border-radius:8px; padding:0.8rem 1rem; margin-top:1rem; font-size:0.8rem; color:#856404; text-align:center; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-icon">👑</div>
    <div class="login-title">Owner Login</div>
    <div class="login-sub">HomeMade Pickles & Snacks — Admin Panel</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" name="email" placeholder="owner@pickles.com" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Login to Admin Panel</button>
    </form>

    <div class="hint-box">
        🔑 Test credentials:<br>
        <b>Email:</b> owner@pickles.com &nbsp;|&nbsp; <b>Password:</b> owner123
    </div>
</div>
</body>
</html>
