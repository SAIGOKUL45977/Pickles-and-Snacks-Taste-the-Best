{% extends "base.html" %}
{% block title %}Login - HomeMade Pickles & Snacks{% endblock %}
{% block extra_css %}
<style>
.auth-container { max-width:440px; margin:3rem auto; }
.auth-card { background:#fff; border-radius:16px; padding:2.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.auth-title { font-family:'Playfair Display',serif; font-size:1.8rem; color:var(--primary); margin-bottom:0.3rem; }
.form-group { margin-bottom:1.2rem; }
.form-group label { display:block; font-weight:700; font-size:0.85rem; margin-bottom:0.4rem; color:var(--text); }
.form-group input {
    width:100%; padding:0.7rem 1rem;
    border:2px solid var(--border); border-radius:8px;
    font-size:0.95rem; outline:none; transition:border 0.2s;
}
.form-group input:focus { border-color:var(--primary); }
.auth-footer { text-align:center; margin-top:1rem; font-size:0.9rem; color:var(--muted); }
.auth-footer a { color:var(--primary); font-weight:700; }
</style>
{% endblock %}
{% block content %}
<div class="auth-container">
<div class="auth-card">
    <div class="auth-title">🥒 Welcome Back</div>
    <p style="color:var(--muted);margin-bottom:1.5rem;">Login to continue shopping</p>
    <form method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;">Login</button>
    </form>
    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </div>
</div>
</div>
{% endblock %}
